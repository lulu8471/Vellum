<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width"><title>Local OCR candidate diagnostic</title>
<style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;height:22rem}td,th{border:1px solid #ccc;padding:.3rem}table{border-collapse:collapse}</style>
<div id="root" hidden></div><h1>Local OCR candidate diagnostic</h1><p>This test reads the chosen PDF only in this browser. No document contents are uploaded. It does not change the production converter.</p>
<input id="file" type="file" accept="application/pdf"><button id="run">Run candidate OCR</button><p id="status">Choose a PDF.</p><pre id="result"></pre><div id="evidence"></div>
<script type="module">
const q=s=>document.querySelector(s);
q('#run').onclick=async()=>{const file=q('#file').files[0];if(!file)return;q('#run').disabled=true;q('#evidence').replaceChildren();q('#result').textContent='';
try{const {readInvoicePdf}=await import('./invoice-parser-candidate.js');let r,traces;try{r=await readInvoicePdf(file,p=>q('#status').textContent=p.label);q('#result').textContent=JSON.stringify({status:'verified',totals:r.declaredTotals,weights:r.lines.map(x=>({sku:x.sku,weight:x.unitWeightGrams})),numericEvidence:r.numericEvidence},null,2);traces=r.diagnosticTraces;}catch(e){q('#result').textContent=JSON.stringify({status:'blocked',error:e.message,numericEvidence:e.numericEvidence},null,2);traces=e.diagnosticTraces;}
for(const t of traces||[]){const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre'),area=document.createElement('textarea');summary.textContent=`Page ${t.page}, scale ${t.scale}, PSM ${t.psm}`;const fields=(t.rawTsv||'').split('\n').slice(1).map(l=>l.split('\t')).filter(w=>w[0]==='5'&&w[11]?.trim());const groups=new Map();for(const w of fields){const k=w.slice(1,5).join(':');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(w)};const weights=[];for(const words of groups.values()){for(let i=0;i<words.length;i++)if(/^gm$/i.test(words[i][11])&&i>0){const n=words[i-1];weights.push({context:words.map(w=>w[11]).join(' '),rawWeight:n[11],confidence:Number(n[10]),bbox:n.slice(6,10).map(Number)})}}pre.textContent=JSON.stringify(weights,null,2);area.value=t.rawText;area.readOnly=true;details.append(summary,pre,area);q('#evidence').append(details)}q('#status').textContent='Finished. Expand a page to inspect original full-page weight readings.';
}catch(e){q('#status').textContent=e.message}finally{q('#run').disabled=false}};
</script>
